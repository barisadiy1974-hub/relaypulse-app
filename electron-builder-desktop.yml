# Halka acik masaustu paketleri (Windows + Linux).
#
# Neden ayri bir dosya: package.json'daki "build" alani Mac App Store paketini
# tanimliyor ve ona dokunulmamali (build 8 yuklendi). Bu dosya yalnizca
# --config ile cagrildiginda kullanilir.
#
# Mac hedefi YOK: macOS kullanicilari App Store surumunu aliyor. Buradan
# imzasiz bir .dmg yayinlamak Gatekeeper'a takilirdi.
appId: io.relaypulse.app
productName: RelayPulse
asar: true

files:
  - "**/*"
  - "!**/*.md"
  - "!tools/**"
  - "!electron-builder*.yml"
  - "!dist/**"
  - "!dist-*/**"
  - "!.git/**"
  # .claude bir kez asar'a girdi ve icinde gercek relay IP'si vardi.
  - "!.claude/**"
  - "!**/__pycache__/**"
  - "!build/**"

directories:
  output: dist-public

linux:
  # .deb yaninda: AppImage Ubuntu 22.04+ uzerinde libfuse2 olmadan acilmiyor,
  # 24.04'te de AppArmor Electron sandbox'ini engelleyip uygulamayi sessizce
  # kapatiyor. .deb normal bir program gibi kurulur, FUSE istemez ve kurulum
  # betigi chrome-sandbox iznini dogru ayarlar.
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Utility
  synopsis: SSH monitoring and AI auto-fix for relay fleets
  description: Monitor every Linux server you run over SSH, with alerts and AI auto-fix.
  # deb paketi bir bakimci ister; sitedeki destek adresi.
  maintainer: RelayPulse <baris.adiy1974@gmail.com>

win:
  target:
    - portable
  icon: assets/icon.png
  # Sitedeki mevcut indirme adlariyla ayni kalip: varsayilan ad ("RelayPulse
  # 1.7.2.exe") hem bosluk iceriyor hem mimariyi soylemiyor.
  artifactName: "RelayPulse-${version}-windows-${arch}.exe"
